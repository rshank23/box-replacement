[project]
name = "mbox-vtmf-backend"
version = "1.0.0"
description = "MBox to Veeva Vault TMF (VTMF) post-study archival automation"
requires-python = ">=3.11"
authors = [{ name = "Clinical Data Engineering" }]
readme = "backend.md"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.2",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "aiolimiter>=1.1",
    "pybreaker>=1.0.2",
    "apscheduler>=3.10.4",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=6.1",
    "structlog>=24.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "testcontainers[postgres]>=4.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"
markers = ["integration: requires Docker (Testcontainers PostgreSQL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
