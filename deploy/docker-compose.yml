name: mbox-vtmf

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: mbox_vtmf
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d mbox_vtmf"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DB_DSN: postgresql+psycopg2://app:app@db:5432/mbox_vtmf
    command: >
      sh -c "alembic -c db/alembic.ini upgrade head &&
             python scripts/make_demo_data.py &&
             python scripts/seed.py"
    volumes:
      - ../demo/mbox:/data/mbox
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DB_DSN: postgresql+psycopg2://app:app@db:5432/mbox_vtmf
      MBOX_ROOT: /data/mbox
      VAULT_CLIENT: fake
      AUTH_ENABLED: "false"
      LOG_LEVEL: INFO
      PROMETHEUS_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ../demo/mbox:/data/mbox:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  watcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "app.workers.watcher.main"]
    environment:
      DB_DSN: postgresql+psycopg2://app:app@db:5432/mbox_vtmf
      MBOX_ROOT: /data/mbox
      MBOX_POLL_ISO_DURATION: PT5M
      INTEGRATION_API_BASE_URL: http://api:8080
      VAULT_CLIENT: fake
      LOG_LEVEL: INFO
    ports: ["9101:9101"]
    volumes:
      - ../demo/mbox:/data/mbox:ro
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api, watcher]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports: ["3000:80"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
